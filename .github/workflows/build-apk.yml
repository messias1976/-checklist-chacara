name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check www/app.js
      - name: Verify required web assets
        run: |
          test -s www/index.html
          test -s www/app.js
          test -s www/manifest.json
          node -e "JSON.parse(require('fs').readFileSync('www/manifest.json','utf8'))"
      - name: Validate Capacitor configuration
        run: npx cap doctor
      - name: Confirm Android package identifier
        run: node -e "const c=JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')); if(c.appId!=='br.com.m2co.checklistchacara') process.exit(1); console.log('Android package:',c.appId)"
      - name: Create Android project
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Verify APK exists and is not empty
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: checklist-chacara-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
